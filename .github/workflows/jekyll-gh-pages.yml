# Deploys the site to GitHub Pages.
# Before uploading it generates a share-preview page for every artist and video
# (scripts/gen-share-pages.mjs), and re-deploys once an hour so new artists/videos
# get their Facebook / LINE / X preview without a manual push.
# Using Cloudflare Pages instead? You can delete this file — functions/ does the same live.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate share-preview pages
        run: node scripts/gen-share-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        
