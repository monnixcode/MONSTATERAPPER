<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Mon HipHop</title><link rel="icon" href="/logo.png">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e0e10;color:#f2f0ea;font:16px/1.6 Inter,system-ui,sans-serif;text-align:center;padding:24px}a{display:inline-block;margin-top:18px;padding:12px 24px;border-radius:99px;background:#d4a64a;color:#111;font-weight:600;text-decoration:none}h1{font-size:56px;margin:0}</style>
<script>
/* Static hosts (GitHub Pages) have no /a/<name> or /v/<id> pages for brand-new artists/videos:
   send them to the real page, which reads the name/id from the query string. */
(function(){var p=location.pathname,m;
 if(m=p.match(/^\/a\/([^\/]+)\/?$/))location.replace('/artist.html?u='+m[1]);
 else if(m=p.match(/^\/v\/([^\/]+)\/?$/))location.replace('/videos.html?v='+m[1]);})();
</script></head>
<body><div><h1>404</h1><p>This page does not exist.</p><a href="/index.html">Back to Mon HipHop</a></div></body></html>
