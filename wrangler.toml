# Cloudflare Pages configuration (https://developers.cloudflare.com/pages/)
#
# - Build output = the `public/` folder (everything that is published).
# - `functions/` at the project root is picked up automatically:
#     /a/<username>  → live share preview for an artist
#     /v/<video id>  → live share preview for a music video
# - Nothing else in the repo (supabase/, scripts/, README) is published.

name = "monhiphop"
compatibility_date = "2026-10-01"
pages_build_output_dir = "public"
